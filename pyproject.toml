[project]
name = "court-vitals"
version = "0.1.0"
description = "NBA analytics: Elo ratings, Monte Carlo season simulation, and player health modeling"
requires-python = ">=3.11"
dependencies = [
    "nba_api>=1.4",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ingestion*", "ratings*", "injury_risk*", "injury_timeline*", "simulation*", "play_types*", "api*", "pipeline*"]
